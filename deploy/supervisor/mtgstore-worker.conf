; Supervisor programs for Symfony Messenger workers (alternative to systemd).
; Copy to /etc/supervisor/conf.d/, edit paths/user/environment, then:
;   supervisorctl reread && supervisorctl update
;
; Keep async (Archidekt / catalog) and csv (store uploads) as separate programs
; so a long harvest cannot starve imports.

[program:mtgstore-worker]
command=/usr/bin/php bin/console messenger:consume async failed --time-limit=3600 --memory-limit=256M --failure-limit=10 -v
directory=/var/www/mtgstore/backend
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
environment=APP_ENV="prod"
stdout_logfile=/var/log/mtgstore/worker.log
stderr_logfile=/var/log/mtgstore/worker.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:mtgstore-worker-import]
command=/usr/bin/php bin/console messenger:consume csv failed --time-limit=3600 --memory-limit=256M --failure-limit=10 -v
directory=/var/www/mtgstore/backend
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
environment=APP_ENV="prod"
stdout_logfile=/var/log/mtgstore/worker-import.log
stderr_logfile=/var/log/mtgstore/worker-import.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; Schedule ticker for the recurring jobs in src/Scheduler/ — nightly catalog
; syncs and subscription renewals. It only dispatches messages; the workers
; above execute them, so without this program neither ever fires.
;
; numprocs stays at 1: a second ticker would emit every recurring message
; twice. Renewals are idempotent per billing period so that would not
; double-charge, but catalog syncs would run twice for nothing.
[program:mtgstore-scheduler]
command=/usr/bin/php bin/console messenger:consume scheduler_catalog scheduler_billing scheduler_commanders --time-limit=3600 --memory-limit=256M -v
directory=/var/www/mtgstore/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
environment=APP_ENV="prod"
stdout_logfile=/var/log/mtgstore/scheduler.log
stderr_logfile=/var/log/mtgstore/scheduler.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
