<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05080f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="LGS Card Vault — Magic, Pokémon, One Piece, and Flesh & Blood from trusted local game stores." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LGS Card Vault</title>
    <!-- Apply the saved/system theme before paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <style>
      .tilt-holo,
      .foil-shimmer {
        filter: url(#foil-holo-warp) saturate(1.55) contrast(1.14) brightness(1.06);
      }
      @media (prefers-reduced-motion: reduce) {
        .tilt-holo,
        .foil-shimmer {
          filter: saturate(1.45) contrast(1.1) brightness(1.04);
        }
      }
    </style>
    <!-- Shared holographic warp for idle foil overlays. Displacement is in
         pixels so it stays on the overlay, not the card art. -->
    <svg id="foil-holo-defs" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden">
      <defs>
        <filter id="foil-holo-warp" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="11" result="holo-noise">
            <animate attributeName="baseFrequency" dur="12s" values="0.012 0.024;0.022 0.014;0.012 0.024" repeatCount="indefinite" />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="holo-noise" scale="18" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
