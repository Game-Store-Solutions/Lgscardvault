<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05080f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="LGS Card Vault — Magic, Pokémon, One Piece, and Flesh & Blood from trusted local game stores." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LGS Card Vault</title>
    <!-- Apply the saved/system theme before paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
