# nginx site config for the production SPA image.
#
# - Serves the built React bundle from /usr/share/nginx/html.
# - Falls back to index.html so client-side routes (deep links like
#   /s/{slug}/admin) resolve instead of 404ing.
# - Long-caches fingerprinted assets; never caches index.html so new deploys
#   are picked up immediately.
# - Proxies /api to the backend so the SPA stays same-origin (matches the dev
#   Vite proxy). Backend host is resolved via Docker DNS (see resolver below).
# - Exact locations for robots.txt, sitemap, Markdown, and /.well-known/* so
#   those paths are never the SPA HTML (soft-404s fail agent-readiness scans).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare / isitagentready Markdown-for-agents: only when the client
# explicitly asks for text/markdown. Compare to 1 — nginx treats the string
# "0" as truthy in a bare `if ($var)`.
map $http_accept $prefer_markdown {
    default           0;
    "~*text/markdown" 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Docker's embedded DNS. A static `upstream { server backend:8000; }` is
    # resolved once at nginx start; after a backend-only recreate the old IP
    # 502s /health and /api until frontend is also bounced. Variables force
    # re-resolution (valid=10s) so smoke checks pass on backend-only deploys.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Parent add_header is dropped on any location that sets its own. Repeat
    # nosniff / Referrer-Policy / X-Frame-Options on those locations below.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # RFC 8288 discovery on HTML (and Markdown) responses.
    set $agent_discovery_links '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json", </sitemap.xml>; rel="describedby"; type="application/xml", </llms.txt>; rel="describedby"; type="text/plain", </auth.md>; rel="service-doc"; type="text/markdown"';

    # gzip text assets.
    gzip on;
    gzip_types text/plain text/css text/markdown text/xml application/xml application/javascript application/json application/linkset+json image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck endpoint.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        return 200 'ok';
    }

    # --- Agent / crawler documents (no SPA fallback) -------------------------

    location = /robots.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_pass $backend_upstream/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location = /auth.md {
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
        add_header Vary "Accept" always;
        add_header Link $agent_discovery_links always;
        add_header Content-Signal "search=yes, ai-train=yes, ai-input=yes" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location = /openapi.json {
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location = /.well-known/api-catalog {
        gzip off;
        default_type application/linkset+json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location = /.well-known/agent-skills/index.json {
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # Square / Apple Pay domain association. Exact path, no SPA fallback.
    location = /.well-known/apple-developer-merchantid-domain-association {
        gzip off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # Any other /.well-known URL must 404 as itself — never index.html.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ^~ /skills/ {
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # Backend probes (outside /api JWT firewall) — same paths as RUNBOOK smoke checks.
    location = /health {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Same-origin API proxy to the backend.
    location /api/ {
        # CSV imports can be up to 10 MB (see StoreCsvImportController::MAX_UPLOAD_BYTES).
        # Allow a little headroom so oversized uploads hit the app's clear 422
        # ("CSV exceeds the maximum allowed size") instead of nginx's opaque 413.
        # nginx's default is only 1 MB, which silently rejects any large import.
        client_max_body_size 12m;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Avatar / branding uploads live on the backend (public/uploads). Without
    # this proxy, /uploads/* falls through to the SPA and profile photos 404.
    location /uploads/ {
        client_max_body_size 5m;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Fingerprinted build assets: immutable, cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # SPA entry: never cache index.html; fall back to it for client routes.
    # Repeat security headers: nginx drops parent add_header in locations that set their own.
    # Markdown Accept on document routes serves /index.md instead of the SPA.
    location / {
        if ($prefer_markdown = 1) {
            rewrite ^ /index.md last;
        }
        add_header Cache-Control "no-cache";
        add_header Vary "Accept" always;
        add_header Link $agent_discovery_links always;
        add_header Content-Signal "search=yes, ai-train=yes, ai-input=yes" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }
}
