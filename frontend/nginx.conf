# nginx site config for the production SPA image.
#
# - Serves the built React bundle from /usr/share/nginx/html.
# - Falls back to index.html so client-side routes (deep links like
#   /s/{slug}/admin) resolve instead of 404ing.
# - Long-caches fingerprinted assets; never caches index.html so new deploys
#   are picked up immediately.
# - Proxies /api to the backend so the SPA stays same-origin (matches the dev
#   Vite proxy). Backend host is resolved via Docker DNS (see resolver below).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. A static `upstream { server backend:8000; }` is
    # resolved once at nginx start; after a backend-only recreate the old IP
    # 502s /health and /api until frontend is also bounced. Variables force
    # re-resolution (valid=10s) so smoke checks pass on backend-only deploys.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Parent add_header is dropped on any location that sets its own. Repeat
    # nosniff / Referrer-Policy / X-Frame-Options on those locations below.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck endpoint.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        return 200 'ok';
    }

    # Square / Apple Pay domain verification. Exact path, no SPA fallback.
    location = /.well-known/apple-developer-merchantid-domain-association {
        gzip off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # Backend probes (outside /api JWT firewall) — same paths as RUNBOOK smoke checks.
    location = /health {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Same-origin API proxy to the backend.
    location /api/ {
        # CSV imports can be up to 10 MB (see StoreCsvImportController::MAX_UPLOAD_BYTES).
        # Allow a little headroom so oversized uploads hit the app's clear 422
        # ("CSV exceeds the maximum allowed size") instead of nginx's opaque 413.
        # nginx's default is only 1 MB, which silently rejects any large import.
        client_max_body_size 12m;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Avatar / branding uploads live on the backend (public/uploads). Without
    # this proxy, /uploads/* falls through to the SPA and profile photos 404.
    location /uploads/ {
        client_max_body_size 5m;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Fingerprinted build assets: immutable, cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # SPA entry: never cache index.html; fall back to it for client routes.
    # Repeat security headers: nginx drops parent add_header in locations that set their own.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }
}
