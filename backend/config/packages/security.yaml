security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: App\Security\AuthenticationSuccessHandler
                failure_handler: App\Security\AuthenticationFailureHandler
            # Brute-force protection: after too many failed logins from the same
            # IP+username, further attempts get 429 until the window passes.
            # Backed by symfony/rate-limiter (see config/packages/rate_limiter.yaml).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        # Square calls these server-to-server with no session. The OAuth callback
        # is guarded by its signed state parameter and the webhook by its HMAC
        # signature, so neither relies on the firewall for authentication.
        - { path: ^/api/integrations/square/callback, roles: PUBLIC_ACCESS }
        - { path: ^/api/integrations/square/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/integrations/paypal/callback, roles: PUBLIC_ACCESS }
        - { path: ^/api/integrations/paypal/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/plans$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/stores, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/stores/.+/customer/checkout/config, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/stores/.+/guest/checkout, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/stores/.+/guest/checkout/config, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/stores/.+/guest/checkout/paypal/order, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/stores/.+/guest/checkout/pay-in-store, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/stores/.+/guest/orders/.+/balance, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/stores/.+/guest/orders/.+/paypal/order, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/stores/.+/guest/orders/.+/paypal/capture, roles: PUBLIC_ACCESS, methods: [POST] }
        # Mass search posts a name list; GET would overflow the URL on a 100-card deck.
        - { path: ^/api/stores/.+/inventory/mass-search, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/catalog, roles: PUBLIC_ACCESS, methods: [GET] }
        # Public commander deck builder (catalog-only, no store inventory).
        - { path: ^/api/recommend, roles: PUBLIC_ACCESS }
        # Landing-page contact form; rate limited per IP in the controller.
        - { path: ^/api/contact, roles: PUBLIC_ACCESS, methods: [POST] }
        # CCPA / privacy-rights intake; rate limited per IP in the controller.
        - { path: ^/api/privacy/requests$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/legal, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
