# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\Spellbook\SpellbookClientInterface: '@App\Service\Spellbook\SpellbookClient'
    App\Service\Pricing\MarketPriceSource: '@App\Service\Pricing\MarketPriceResolver'

    # ---------------------------------------------------------------------
    # Commander Intelligence & Synergy Engine
    # Tunables live in config/packages/commander_intelligence.yaml.
    # ---------------------------------------------------------------------

    App\Service\Recommend\Intelligence\RecommendationWeights:
        arguments:
            $weights: '%commander_intelligence.weights%'
            $stockBonus: '%commander_intelligence.stock_bonus%'

    App\Service\Recommend\Intelligence\CommanderIntelligenceProvider:
        arguments:
            $maxAgeDays: '%commander_intelligence.max_age_days%'

    App\Service\Recommend\Intelligence\CommanderIntelligenceRefresher:
        arguments:
            $deckProvider: '@App\Service\Recommend\Provider\CompositeDeckDataProvider'
            $harvestDepth: '%commander_intelligence.harvest_depth%'
            $decksPerStrategy: '%commander_intelligence.decks_per_strategy%'

    App\MessageHandler\RefreshStaleCommanderIntelligenceMessageHandler:
        arguments:
            $maxAgeDays: '%commander_intelligence.max_age_days%'

    App\Service\Recommend\Intelligence\ReferenceDeckPruner:
        arguments:
            $pruneAgeDays: '%commander_intelligence.prune_age_days%'
            $batchSize: '%commander_intelligence.prune_batch_size%'
            $deleteDeckHeaders: '%commander_intelligence.prune_delete_decks%'

    # Reference deck providers. Listed explicitly rather than via a tag so the
    # composite cannot end up inside its own provider list.
    App\Service\Recommend\Provider\CompositeDeckDataProvider:
        arguments:
            $providers:
                - '@App\Service\Recommend\Provider\Archidekt\ArchidektDeckDataProvider'
                - '@App\Service\Recommend\Provider\MtgJsonPreconDeckProvider'
                - '@App\Service\Recommend\Provider\LocalDeckDataProvider'
    App\Service\Recommend\Provider\DeckDataProviderInterface: '@App\Service\Recommend\Provider\CompositeDeckDataProvider'

    App\Service\Recommend\Provider\Archidekt\ArchidektClientInterface: '@App\Service\Recommend\Provider\Archidekt\ArchidektClient'

    App\Service\Recommend\Provider\Archidekt\ArchidektClient:
        arguments:
            $cacheTtl: '%commander_intelligence.archidekt.cache_ttl%'

    App\Service\Recommend\Provider\Archidekt\ArchidektDeckDataProvider:
        arguments:
            $enabled: '%commander_intelligence.archidekt.enabled%'
            $harvestDepth: '%commander_intelligence.harvest_depth%'

    App\Service\Recommend\Provider\MtgJsonPreconDeckProvider:
        arguments:
            $enabled: '%commander_intelligence.mtgjson_precon.enabled%'
            $cacheTtl: '%commander_intelligence.mtgjson_precon.cache_ttl%'

    App\Service\Recommend\Provider\LocalDeckDataProvider:
        arguments:
            $enabled: '%commander_intelligence.local_decks.enabled%'

    # Shared 1 req/s Archidekt budget across web and worker processes. The lock
    # lives in var/ (app-owned) for the same reason as the Scryfall throttle:
    # systemd PrivateTmp would otherwise give each unit its own file and
    # silently break the "one global budget" guarantee.
    App\Service\Recommend\Provider\Archidekt\ArchidektRateLimiter:
        arguments:
            $lockFilePath: '%kernel.project_dir%/var/archidekt/rate.lock'
            $minIntervalMicroseconds: '%commander_intelligence.archidekt.min_interval_us%'

    App\Service\Recommend\Provider\Archidekt\ArchidektCircuitBreaker:
        arguments:
            $stateFilePath: '%kernel.project_dir%/var/archidekt/circuit.json'
            $failureThreshold: '%commander_intelligence.archidekt.circuit_failure_threshold%'
            $cooldownSeconds: '%commander_intelligence.archidekt.circuit_cooldown_seconds%'

    # Return HTTP 429 for login-throttling failures; delegate all other auth
    # failures to Lexik's JWT handler (see App\Security\AuthenticationFailureHandler).
    App\Security\AuthenticationFailureHandler:
        arguments:
            $decorated: '@lexik_jwt_authentication.handler.authentication_failure'

    App\Security\AuthenticationSuccessHandler:
        arguments:
            $decorated: '@lexik_jwt_authentication.handler.authentication_success'

    # Shared Scryfall throttle: the lock file lives in var/ (app-owned, shared
    # by web + messenger processes on the host) rather than the system temp
    # dir, where PrivateTmp systemd units would silently give each service its
    # own file — reverting the "one global budget" guarantee — and where a
    # predictable world-writable path invites tampering.
    App\Service\Scryfall\ScryfallRateLimiter:
        arguments:
            $lockFilePath: '%kernel.project_dir%/var/scryfall_rate.lock'

    # The Doctrine profiler's query buffer is only registered in debug mode,
    # so this dependency is optional: '@?' yields null in prod where the
    # service does not exist.
    App\Service\Doctrine\SqlDebugLogPruner:
        arguments:
            $debugDataHolder: '@?doctrine.debug_data_holder'

    # Per-import run logs live under the logs dir (var/log/imports/*.log).
    App\Service\Import\ImportLogger:
        arguments:
            $importLogDir: '%kernel.logs_dir%/imports'

    # Error tracking (off unless SENTRY_DSN is set — see App\Monitoring\ErrorReporter).
    App\Monitoring\ErrorReporter:
        arguments:
            $dsn: '%env(SENTRY_DSN)%'
            $environment: '%env(APP_ENV)%'
            $release: '%env(SENTRY_RELEASE)%'

when@test:
    services:
        # Replace the real Scryfall client with a network-free fake so the test
        # suite is deterministic and never reaches the live API.
        App\Tests\Support\FakeScryfallClient:
            autowire: true
            public: true
        App\Service\Scryfall\ScryfallClient:
            alias: App\Tests\Support\FakeScryfallClient
            public: true

        # Commander Spellbook is also external — keep combo tests offline.
        App\Tests\Support\FakeSpellbookClient:
            autowire: true
            public: true
        App\Service\Spellbook\SpellbookClientInterface:
            alias: App\Tests\Support\FakeSpellbookClient
            public: true

        # Reference decks come from a fixture provider in tests: no Archidekt
        # traffic, and deterministic co-occurrence data so synergy assertions
        # are stable.
        App\Tests\Support\FakeArchidektClient:
            autowire: true
            public: true
        App\Service\Recommend\Provider\Archidekt\ArchidektClientInterface:
            alias: App\Tests\Support\FakeArchidektClient
            public: true

        # MTGJSON precon indexing would fetch ~190 files; keep it out of tests.
        # These definitions replace the ones above, so autowire has to be
        # restated — the test block has no _defaults of its own.
        App\Service\Recommend\Provider\MtgJsonPreconDeckProvider:
            autowire: true
            arguments:
                $enabled: false

        App\Service\Recommend\Provider\Archidekt\ArchidektDeckDataProvider:
            autowire: true
            arguments:
                $enabled: true
                $harvestDepth: '%commander_intelligence.harvest_depth%'

        App\Service\Recommend\Intelligence\CommanderIntelligenceRefresher:
            autowire: true
            public: true
            arguments:
                $deckProvider: '@App\Service\Recommend\Provider\CompositeDeckDataProvider'
                $harvestDepth: '%commander_intelligence.harvest_depth%'
                $decksPerStrategy: '%commander_intelligence.decks_per_strategy%'

        # Tests drive the recommender and its collaborators directly.
        App\Service\Recommend\Intelligence\CommanderIntelligenceProvider:
            autowire: true
            public: true
            arguments:
                $maxAgeDays: '%commander_intelligence.max_age_days%'
        App\Service\Recommend\Intelligence\CardProfileIndex:
            autowire: true
            public: true
        App\Service\Recommend\CommanderRecommender:
            autowire: true
            public: true
        App\Service\Recommend\CommanderDeckAssembler:
            autowire: true
            public: true
        App\Service\Recommend\Intelligence\RecommendationWeights:
            public: true
            arguments:
                $weights: '%commander_intelligence.weights%'
                $stockBonus: '%commander_intelligence.stock_bonus%'

        # Same idea for card checkout: exercise the money paths (capture,
        # decline, rollback) without reaching Square.
        App\Tests\Support\FakeCheckoutGateway:
            autowire: true
            public: true
        App\Service\Payments\CheckoutGatewayInterface:
            alias: App\Tests\Support\FakeCheckoutGateway
            public: true

        # And for the owner's subscription to the platform, so renewals and
        # dunning can be driven through declines without charging anything.
        App\Tests\Support\FakeSubscriptionBilling:
            autowire: true
            public: true
        App\Service\Payments\SubscriptionBillingInterface:
            alias: App\Tests\Support\FakeSubscriptionBilling
            public: true
