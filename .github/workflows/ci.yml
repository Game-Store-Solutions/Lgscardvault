name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The test env appends a "_test" suffix (see config/packages/doctrine.yaml),
      # so this base URL resolves to the store_test database at runtime.
      DATABASE_URL: "postgresql://store:store@127.0.0.1:5432/store?serverVersion=16&charset=utf8"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sodium, intl, mbstring, ctype, iconv
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
        env:
          APP_ENV: test

      - name: Create test database
        run: PGPASSWORD=store psql -h 127.0.0.1 -U store -d store -c 'CREATE DATABASE store_test OWNER store;'

      - name: Run migrations (test)
        run: php bin/console doctrine:migrations:migrate --no-interaction
        env:
          APP_ENV: test

      - name: Lint DI container
        run: php bin/console lint:container
        env:
          APP_ENV: test

      - name: Run PHPUnit
        run: php bin/phpunit
        env:
          APP_ENV: test

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  security:
    name: Security (deps + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can diff the whole tree.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sodium, intl, mbstring, ctype, iconv
          coverage: none
          tools: composer:v2

      # Fails on any known advisory against the committed composer.lock.
      # --locked audits the lock file directly (no composer install needed).
      - name: Composer audit
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Fail only on high/critical advisories (low/moderate are informational).
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      # Catch committed secrets/credentials before they merge.
      # Use the free CLI (orgs need a paid license for gitleaks-action@v2).
      # Download via `gh` + GITHUB_TOKEN — anonymous release CDN often 503s.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gh release download "v${GITLEAKS_VERSION}" \
            --repo gitleaks/gitleaks \
            --pattern "${asset}" \
            --dir /tmp
          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code=1

  # Single aggregating check to require in branch protection: it only passes
  # when all jobs above succeed, so one required status covers the whole suite
  # (and new jobs are covered automatically once added to `needs`).
  ci-success:
    name: CI success
    if: always()
    needs: [backend, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required CI job failed or was cancelled."
          exit 1
      - name: All required jobs passed
        run: echo "Backend, frontend, and security checks passed."
